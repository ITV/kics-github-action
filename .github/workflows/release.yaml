name: Release

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:
  release:
    types: [published]

permissions: {}

jobs:
  release:
    # Numeric owner ID survives the mirror's namespace rewrite.
    if: github.repository_owner_id == '625148' && github.event_name != 'release' && !contains(github.event.head_commit.message || '', '[skip ci]')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      pull-requests: write
      issues: write

    outputs:
      version: ${{ steps.semantic.outputs.new_release_version }}
      released: ${{ steps.semantic.outputs.new_release_published }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          package-manager-cache: false

      - name: Install semantic-release dependencies
        run: |
          npm install -g semantic-release
          npm install -g @semantic-release/git
          npm install -g @semantic-release/github

      - name: Run semantic-release
        id: semantic
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PREVIOUS_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          npx semantic-release --debug
          LATEST_TAG=$(gh release list --limit 1 --json tagName --jq '.[0].tagName // ""')
          if [[ "$LATEST_TAG" == "$PREVIOUS_TAG" ]]; then
            echo "new_release_published=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ ! "$LATEST_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: $LATEST_TAG"
            exit 1
          fi
          echo "new_release_version=${LATEST_TAG#v}" >> "$GITHUB_OUTPUT"
          echo "new_release_published=true" >> "$GITHUB_OUTPUT"

  build-and-tag:
    needs: release
    # Source GITHUB_TOKEN releases do not trigger another workflow; mirror App releases do.
    if: >-
      always() && !cancelled() &&
      ((github.event_name == 'release' && !github.event.release.prerelease) ||
       needs.release.outputs.released == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.release.tag_name || format('v{0}', needs.release.outputs.version) }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version components
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || format('v{0}', needs.release.outputs.version) }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Unexpected release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="${RELEASE_TAG#v}"

          # Extract major, minor, patch
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "🔍 Debug: Version components - MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH"

          {
            printf 'full=%s\n' "$VERSION"
            printf 'major=%s\n' "$MAJOR"
            printf 'minor=%s\n' "$MINOR"
            printf 'patch=%s\n' "$PATCH"
            printf 'major_tag=v%s\n' "$MAJOR"
            printf 'minor_tag=v%s.%s\n' "$MAJOR" "$MINOR"
            printf 'patch_tag=v%s.%s.%s\n' "$MAJOR" "$MINOR" "$PATCH"
          } >> "$GITHUB_OUTPUT"

          echo "🔍 Debug: Generated tags - major_tag=v$MAJOR, minor_tag=v$MAJOR.$MINOR, patch_tag=v$MAJOR.$MINOR.$PATCH"

      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5
        with:
          images: ghcr.io/itv/kics-github-action
          tags: |
            # Latest tag
            type=raw,value=latest
            # Full semantic version
            type=raw,value=${{ steps.version.outputs.patch_tag }}
            # Mutable major version tag (v1, v2, etc.)
            type=raw,value=${{ steps.version.outputs.major_tag }}
            # Mutable minor version tag (v1.2, v1.3, etc.)
            type=raw,value=${{ steps.version.outputs.minor_tag }}
            # Existing mirror action refs use :develop; publish it from the synced release.
            type=raw,value=develop,enable=${{ github.repository_owner_id == '284316599' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Update mutable tags
        run: |
          echo "Successfully built and pushed:"
          echo "- ghcr.io/itv/kics-github-action:latest"
          echo "- ghcr.io/itv/kics-github-action:${{ steps.version.outputs.patch_tag }}"
          echo "- ghcr.io/itv/kics-github-action:${{ steps.version.outputs.major_tag }} (mutable)"
          echo "- ghcr.io/itv/kics-github-action:${{ steps.version.outputs.minor_tag }} (mutable)"

  update-action-refs:
    needs: [release, build-and-tag]
    if: needs.release.outputs.released == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          ref: v${{ needs.release.outputs.version }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Update mutable Git tags
        run: |
          VERSION="${{ needs.release.outputs.version }}"
          echo "Creating mutable tags for version: $VERSION"

          # Extract version components
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
          echo "Version components: MAJOR=$MAJOR, MINOR=$MINOR, PATCH=$PATCH"

          # Configure git
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Create and push major version tag (v1, v2, etc.)
          echo "Creating major version tag: v$MAJOR"
          git tag -f "v$MAJOR"
          git push origin "v$MAJOR" --force
          echo "✅ Updated mutable tag v$MAJOR to point to v$VERSION"

          # Create and push minor version tag (v1.2, v1.3, etc.)
          echo "Creating minor version tag: v$MAJOR.$MINOR"
          git tag -f "v$MAJOR.$MINOR"
          git push origin "v$MAJOR.$MINOR" --force
          echo "✅ Updated mutable tag v$MAJOR.$MINOR to point to v$VERSION"

          # List all tags to verify
          echo "Current tags:"
          git tag --sort=-version:refname | head -10

      - name: Create release summary
        env:
          VERSION: ${{ needs.release.outputs.version }}
        run: |
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION#*.}"
          MINOR="${MINOR%%.*}"
          {
            printf "## Release Summary\n\n"
            printf "**Version:** \`v%s\`\n\n" "$VERSION"
            printf "### Tags Created\n- \`v%s\` - Immutable release tag\n- \`v%s\` - Mutable major version tag\n- \`v%s.%s\` - Mutable minor version tag\n\n" \
              "$VERSION" "$MAJOR" "$MAJOR" "$MINOR"
            printf "### Docker Images\n- \`ghcr.io/itv/kics-github-action:latest\`\n- \`ghcr.io/itv/kics-github-action:v%s\`\n- \`ghcr.io/itv/kics-github-action:v%s\`\n- \`ghcr.io/itv/kics-github-action:v%s.%s\`\n\n" \
              "$VERSION" "$MAJOR" "$MAJOR" "$MINOR"
            printf "### Usage\n- \`ITV/kics-github-action@v%s\`\n- \`ITV/kics-github-action@v%s\`\n" \
              "$VERSION" "$MAJOR"
          } >> "$GITHUB_STEP_SUMMARY"
